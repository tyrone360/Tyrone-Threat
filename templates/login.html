```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Tyrone Threat</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
            background: var(--background);
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            padding: 35px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .auth-card h1 { margin-bottom: 8px; }

        .auth-subtitle {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .auth-field { margin-bottom: 20px; }

        .auth-field label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
        }

        .auth-field input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--surface-light);
            color: var(--text);
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: var(--surface-light);
            color: var(--text);
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
        }

        .auth-footer a { color: var(--primary-light); }
    </style>
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Log in to your Tyrone Threat account.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="auth-message" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="auth-field">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Log In
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create Account</a>
            </p>

        </section>
    </main>
</body>
</html>
